[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ai-vision-maintenance"
version = "0.1.0"
description = "Industrial computer vision and predictive maintenance research platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "Pillow>=10.0,<13.0",
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0.2,<7.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]